<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BANKING77 taxonomy review</title>
  <style>
    :root {
      --bg: #f8f5f0;
      --fg: #3c3732;
      --l1: #6c4f3b;
      --accent: #c58c32;
      --flag-bg: #fff3cd;
      --border: #ddd5c8;
      --active: #efe6d8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 1rem 1.25rem 2rem;
      line-height: 1.4;
    }
    h1 { font-size: 1.25rem; color: var(--l1); margin: 0 0 0.35rem; }
    .meta { font-size: 0.85rem; margin: 0 0 0.75rem; }
    .crumb {
      font-size: 0.9rem; margin: 0 0 0.75rem; min-height: 1.3em;
    }
    .crumb span { color: var(--l1); font-weight: 600; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
      margin-bottom: 0.85rem;
    }
    #q {
      flex: 1; min-width: 14rem; padding: 0.45rem 0.6rem;
      border: 1px solid var(--border); border-radius: 6px;
    }
    .menu {
      display: grid;
      grid-template-columns: minmax(11rem, 0.9fr) minmax(13rem, 1fr) minmax(16rem, 1.4fr);
      gap: 0.6rem;
      align-items: start;
    }
    .col {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 18rem;
      overflow: auto;
      max-height: 70vh;
    }
    .col h2 {
      margin: 0; padding: 0.55rem 0.75rem;
      font-size: 0.75rem; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--l1);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: #fff;
    }
    button.item {
      display: flex; width: 100%; text-align: left;
      justify-content: space-between; gap: 0.5rem;
      border: 0; background: transparent; color: inherit;
      font: inherit; padding: 0.55rem 0.75rem; cursor: pointer;
    }
    button.item:hover { background: #faf7f2; }
    button.item.active { background: var(--active); font-weight: 600; }
    button.item .count { color: #7a7066; font-weight: 400; font-size: 0.8rem; }
    .leaf {
      padding: 0.55rem 0.75rem; border-bottom: 1px solid #f0ebe4;
      font-size: 0.9rem;
    }
    .leaf code {
      background: #eee8df; padding: 0.05rem 0.35rem; border-radius: 4px;
      font-size: 0.78rem; margin-right: 0.35rem;
    }
    .flag {
      display: inline-block; margin-left: 0.35rem; font-size: 0.72rem;
      background: var(--flag-bg); padding: 0.05rem 0.35rem; border-radius: 4px;
    }
    .rationale { display: block; font-size: 0.78rem; color: #6b635b; margin-top: 0.2rem; }
    .empty { padding: 0.8rem 0.75rem; color: #7a7066; font-size: 0.88rem; }
    .hits { margin: 0 0 0.75rem; font-size: 0.85rem; }
    .hits button {
      margin: 0.2rem 0.35rem 0 0; font: inherit; font-size: 0.8rem;
      border: 1px solid var(--border); background: #fff; border-radius: 999px;
      padding: 0.2rem 0.55rem; cursor: pointer;
    }
    @media (max-width: 820px) {
      .menu { grid-template-columns: 1fr; }
      .col { max-height: none; min-height: 0; }
    }
  </style>
</head>

  <div class="toolbar">

  <p class="crumb" id="crumb"></p>
  <div class="hits" id="hits" hidden></div>

    </section>
    <section class="col" aria-label="Level 3">

    </section>
  </div>

": "supported_cards_and_currencies", "flag": "", "rationale": "Which cards or currencies can be used to add money; top-up instrument, not the user's card product."}, {"id": 58, "name": "top_up_by_cash_or_cheque", "flag": "", "rationale": "Top up via cash or cheque."}, {"id": 62, "name": "topping_up_by_card", "flag": "", "rationale": "Top up using another card."}, {"id": 71, "name": "verify_top_up", "flag": "", "rationale": "How to verify the card used for a top-up; not a posting status and not identity KYC."}]}, {"name": "top_up_status", "intents": [{"id": 5, "name": "balance_not_updated_after_bank_transfer", "flag": "", "rationale": "Inbound bank transfer not reflected in balance; utterances are top-up posting, not an outgoing transfer."}, {"id": 6, "name": "balance_not_updated_after_cheque_or_cash_deposit", "flag": "", "rationale": "Balance not updated after cash/cheque deposit."}, {"id": 47, "name": "pending_top_up", "flag": "", "rationale": "Top-up pending."}, {"id": 59, "name": "top_up_failed", "flag": "", "rationale": "Top-up failed."}, {"id": 61, "name": "top_up_reverted", "flag": "", "rationale": "Top-up reverted."}]}]}, {"name": "currency_exchange", "families": [{"name": "exchange_info", "intents": [{"id": 31, "name": "exchange_charge", "flag": "", "rationale": "Currency-exchange fee; same family as rate, in-app exchange, and fiat support."}, {"id": 32, "name": "exchange_rate", "flag": "", "rationale": "General exchange rate inquiry."}, {"id": 33, "name": "exchange_via_app", "flag": "", "rationale": "Exchange via mobile app."}, {"id": 36, "name": "fiat_currency_support", "flag": "", "rationale": "Supported fiat currencies."}]}]}, {"name": "refund_and_charges", "families": [{"name": "refund", "intents": [{"id": 51, "name": "Refund_not_showing_up", "flag": "", "rationale": "Refund not visible on account."}, {"id": 52, "name": "request_refund", "flag": "", "rationale": "Customer requests a refund."}]}, {"name": "unrecognised_or_extra_charge", "intents": [{"id": 28, "name": "direct_debit_payment_not_recognised", "flag": "", "rationale": "Unrecognised direct debit."}, {"id": 34, "name": "extra_charge_on_statement", "flag": "", "rationale": "Extra charge on statement."}, {"id": 63, "name": "transaction_charged_twice", "flag": "", "rationale": "Same transaction charged twice."}]}]}, {"name": "identity_verification", "families": [{"name": "kyc", "intents": [{"id": 68, "name": "unable_to_verify_identity", "flag": "", "rationale": "Unable to complete identity verification."}, {"id": 69, "name": "verify_my_identity", "flag": "", "rationale": "Complete identity verification."}, {"id": 70, "name": "verify_source_of_funds", "flag": "", "rationale": "Source-of-funds verification."}, {"id": 74, "name": "why_verify_identity", "flag": "", "rationale": "Why identity verification is required."}]}]}, {"name": "account_and_access", "families": [{"name": "account_lifecycle", "intents": [{"id": 30, "name": "edit_personal_details", "flag": "", "rationale": "Edit personal profile details."}, {"id": 55, "name": "terminate_account", "flag": "", "rationale": "Close or terminate account."}]}, {"name": "app_access_security", "intents": [{"id": 42, "name": "lost_or_stolen_phone", "flag": "", "rationale": "Lost or stolen phone with app access."}, {"id": 44, "name": "passcode_forgotten", "flag": "", "rationale": "Forgotten app passcode."}]}, {"name": "eligibility", "intents": [{"id": 1, "name": "age_limit", "flag": "", "rationale": "Minimum age or age limit policy."}, {"id": 24, "name": "country_support", "flag": "", "rationale": "Country availability support."}]}]}]}</script>
  <script>
    const data = JSON.parse(document.getElementById('taxonomy-data').textContent);
    const col1 = document.getElementById('col1');
    const col2 = document.getElementById('col2');
    const col3 = document.getElementById('col3');
    const crumb = document.getElementById('crumb');
    const q = document.getElementById('q');
    const flagsOnly = document.getElementById('flagsOnly');
    const hits = document.getElementById('hits');
    let selectedL1 = data.levels[0] ? data.levels[0].name : null;
    let selectedL2 = null;
    function esc(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function l1Node(name) {
      return data.levels.find(x => x.name === name);
    }
    function countL3(node) {
      return node.families.reduce((n, f) => n + f.intents.length, 0);
    }
    function intentVisible(intent) {
      return !flagsOnly.checked || intent.flag;
    }
    function familyVisible(family) {
      return family.intents.some(intentVisible);
    }

    function render() {
      const l1 = l1Node(selectedL1);
      if (l1 && !l1.families.some(f => f.name === selectedL2 && familyVisible(f))) {
        const first = l1.families.find(familyVisible);
        selectedL2 = first ? first.name : null;
      }
      col1.innerHTML = '';
      data.levels.forEach(node => {
        const visible = node.families.some(familyVisible);
        if (!visible) return;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'item' + (node.name === selectedL1 ? ' active' : '');
        const n = node.families.reduce((s, f) => s + f.intents.filter(intentVisible).length, 0);
        btn.innerHTML = '<span>' + esc(node.name) + '</span><span class="count">' + n + '</span>';
        btn.onclick = () => { selectedL1 = node.name; selectedL2 = null; render(); };
        col1.appendChild(btn);
      });
      col2.innerHTML = '';
      if (!l1) {
        col2.innerHTML = '<p class="empty">Chọn Level 1</p>';
      } else {
        l1.families.filter(familyVisible).forEach(family => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'item' + (family.name === selectedL2 ? ' active' : '');
          const n = family.intents.filter(intentVisible).length;
          btn.innerHTML = '<span>' + esc(family.name) + '</span><span class="count">' + n + '</span>';
          btn.onclick = () => { selectedL2 = family.name; render(); };
          col2.appendChild(btn);
        });
      }
      col3.innerHTML = '';
      const family = l1 && l1.families.find(f => f.name === selectedL2);
      if (!family) {
        col3.innerHTML = '<p class="empty">Chọn Level 2</p>';
      } else {
        family.intents.filter(intentVisible).forEach(intent => {
          const row = document.createElement('div');
          row.className = 'leaf';
          const flag = intent.flag
            ? '<span class="flag">' + esc(intent.flag) + '</span>'
            : '';
          const why = intent.flag && intent.rationale
            ? '<span class="rationale">' + esc(intent.rationale) + '</span>'
            : '';
          row.innerHTML = '<code>' + esc(intent.id) + '</code><span>' + esc(intent.name) + '</span>' + flag + why;
          col3.appendChild(row);
        });
      }
      const parts = ['BANKING'];
      if (selectedL1) parts.push(selectedL1);
      if (selectedL2) parts.push(selectedL2);
      crumb.innerHTML = parts.map(p => '<span>' + esc(p) + '</span>').join(' → ');
    }

    function searchHits(term) {
      const out = [];
      if (!term) return out;
      data.levels.forEach(l1 => {
        l1.families.forEach(l2 => {
          l2.intents.forEach(intent => {
            if (!intentVisible(intent)) return;
            const blob = (intent.id + ' ' + intent.name + ' ' + l2.name + ' ' + l1.name + ' ' + (intent.flag || '')).toLowerCase();
            if (blob.includes(term)) out.push({ l1: l1.name, l2: l2.name, intent });
          });
        });
      });
      return out.slice(0, 12);
    }

    function onSearch() {
      const term = (q.value || '').trim().toLowerCase();
      const found = searchHits(term);
      hits.hidden = found.length === 0;
      hits.innerHTML = '';
      if (!term || !found.length) { render(); return; }
      found.forEach(hit => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = hit.l1 + ' / ' + hit.l2 + ' / ' + hit.intent.name;
        btn.onclick = () => {
          selectedL1 = hit.l1;
          selectedL2 = hit.l2;
          render();
        };
        hits.appendChild(btn);
      });
      selectedL1 = found[0].l1;
      selectedL2 = found[0].l2;
      render();
    }

    q.addEventListener('input', onSearch);
    flagsOnly.addEventListener('change', () => { onSearch(); });
    render();
  </script>
</body>
</html>
